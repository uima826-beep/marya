<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - لوحة الإدارة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f1923;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-box{background:linear-gradient(135deg,#1a2d44 0%,#162336 100%);border:1px solid rgba(255,255,255,0.08);border-radius:24px;padding:50px 40px;width:100%;max-width:420px;margin:20px;text-align:center;}
.login-box .icon{width:70px;height:70px;border-radius:50%;background:rgba(0,200,255,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
.login-box .icon svg{width:34px;height:34px;}
.login-box h1{font-size:1.4rem;margin-bottom:8px;color:#00c8ff;}
.login-box p{color:#6b7f9e;font-size:0.88rem;margin-bottom:30px;}
.input-group{position:relative;margin-bottom:18px;text-align:right;}
.input-group label{display:block;font-size:0.82rem;color:#6b7f9e;margin-bottom:6px;font-weight:500;}
.input-group input{width:100%;padding:14px 18px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.25);color:#fff;font-size:1rem;font-family:inherit;outline:none;transition:border 0.3s;}
.input-group input:focus{border-color:#00c8ff;}
.login-btn{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,#0080cc,#00c8ff);color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:10px;transition:opacity 0.3s;}
.login-btn:hover{opacity:0.9;}
.login-btn:disabled{opacity:0.5;cursor:not-allowed;}
.error-msg{color:#f87171;font-size:0.85rem;margin-top:12px;min-height:20px;}
</style>
</head>
<body>
<div class="login-box">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#00c8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </div>
  <h1>لوحة الإدارة</h1>
  <p>أدخل كلمة المرور للمتابعة</p>
  <form id="loginForm">
    <div class="input-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-btn" id="loginBtn">تسجيل الدخول</button>
    <div class="error-msg" id="errorMsg"></div>
  </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var btn = document.getElementById('loginBtn');
  var err = document.getElementById('errorMsg');
  var pw = document.getElementById('password').value;
  btn.disabled = true;
  btn.textContent = 'جاري التحقق...';
  err.textContent = '';
  fetch('/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.success) {
      document.cookie = 'admin_token=' + data.token + ';path=/;SameSite=Lax';
      try { localStorage.setItem('admin_token', data.token); } catch(e) {}
      window.location.href = '/admin/';
    } else {
      err.textContent = data.message || 'كلمة المرور غير صحيحة';
      btn.disabled = false;
      btn.textContent = 'تسجيل الدخول';
    }
  })
  .catch(function() {
    err.textContent = 'حدث خطأ، حاول مرة أخرى';
    btn.disabled = false;
    btn.textContent = 'تسجيل الدخول';
  });
});
</script>
</body>
</html>
